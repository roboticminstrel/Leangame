name = "leangame"
defaultTargets = ["Leangame"]

# Mathlib for fields (ℝ, ℂ, Field) and tactics. Only the files Leangame imports are downloaded:
# scripts/setup.sh passes them to `lake exe cache get`, so this is far smaller than all of Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

# The Lean REPL (JSON in, JSON out) that the referee server talks to
[[require]]
name = "REPL"
git = "https://github.com/leanprover-community/repl"
rev = "v4.36.0"

[[lean_lib]]
name = "Leangame"
