# Deploy the site to lean.interlinea.io (PROTOTYPE, written by Claude).
# Infrastructure lives in roboticminstrel/Interlinea-proto (infra/terraform/lean.tf). After its apply, set these
# repository variables here (Settings → Secrets and variables → Actions → Variables) from its outputs:
#   AWS_DEPLOY_ROLE_ARN    lean_deploy_role_arn
#   LEAN_DISTRIBUTION_ID   lean_distribution_id
#   AWS_REGION             the region Interlinea uses (us-east-2 if unset)
# Until AWS_DEPLOY_ROLE_ARN is set, this workflow skips quietly.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["index.html", "styles.css", "src/**", "vendor/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC sign-in to AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    env:
      BUCKET: ${{ vars.LEAN_BUCKET || 'lean-interlinea-io-site' }}
      DISTRIBUTION_ID: ${{ vars.LEAN_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests must pass before anything ships
        run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Upload the site and refresh the cache
        run: scripts/deploy.sh
